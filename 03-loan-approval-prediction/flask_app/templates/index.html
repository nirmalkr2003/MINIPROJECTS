<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loan Approval Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

<div class="container">
    <h1>Loan Approval Prediction</h1>
    <p class="subtitle">Enter applicant details to predict loan approval status</p>

    <form action="/predict" method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Gender</label>
                <select name="Gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <div class="form-group">
                <label>Married</label>
                <select name="Married" required>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <div class="form-group">
                <label>Education</label>
                <select name="Education" required>
                    <option value="Graduate">Graduate</option>
                    <option value="Not Graduate">Not a Graduate</option>
                </select>
            </div>

            <div class="form-group">
                <label>Self Employed</label>
                <select name="Self_Employed" required>
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <div class="form-group">
                <label>Dependents</label>
                <input type="number" name="Dependents" min="0" max="3" required>
            </div>

            <div class="form-group">
                <label>Applicant Income</label>
                <input type="number" name="ApplicantIncome" step="500" required>
            </div>

            <div class="form-group">
                <label>Co-applicant Income</label>
                <input type="number" name="CoapplicantIncome" step="500" required>
            </div>

            <div class="form-group">
                <label>Loan Amount</label>
                <input type="number" name="LoanAmount" step="500" required>
            </div>

            <div class="form-group">
    <label>Loan Term (Years)</label>
    <input type="number" name="Loan_Amount_Term_Years" min="1" max="40" required>
</div>


            <div class="form-group">
                <label>Credit History</label>
                <select name="Credit_History" required>
                    <option value="1">Good (1)</option>
                    <option value="0">Bad (0)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Property Area</label>
                <select name="Property_Area" required>
                    <option value="Urban">Urban</option>
                    <option value="Semiurban">Semiurban</option>
                    <option value="Rural">Rural</option>
                </select>
            </div>

        </div>

        <button type="submit">Predict Loan Status</button>
    </form>

    {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
    {% endif %}
</div>

</body>
</html>
