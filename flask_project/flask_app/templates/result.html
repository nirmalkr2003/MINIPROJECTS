<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <style>
    body {
        margin: 0;
        color: white;
        font-family: Arial, sans-serif;

        /* LOCAL BACKGROUND IMAGE FROM STATIC FOLDER */
        background-image:
            linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
            url("/static/images/bg.jpg");

        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: rgba(0,0,0,0);   /* fully transparent */
        padding: 40px;
        text-align: center;
        box-shadow: none;
    }

    h1 {
        color: #ffffff;
        text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
    }

    .price {
        font-size: 36px;
        color: #22c55e;
        font-weight: 800;
        text-shadow: 2px 2px 10px rgba(0,0,0,1);
        margin: 20px 0;
    }

    /* BACK TO HOME BUTTON – FULLY INVISIBLE */
    a {
    opacity: 0.5;              /* slightly visible */
    background: rgba(182, 189, 185, 0.85);
    color: black;
    padding: 12px 26px;
    border-radius: 8px;
    font-weight: 700;
    text-decoration: none;
    transition: 0.3s ease;
}

a:hover {
    opacity: 1;                /* fully visible on hover */
}

</style>

</head>
<body>

<div class="card">
    <h1>Predicted Car Price</h1>

    {% if price %}
        <div class="price">₹ {{ price }} Lakhs</div>
    {% else %}
        <p>Error: {{ error }}</p>
    {% endif %}

    <a href="/">⬅ Back to Home</a>
</div>

</body>
</html>
